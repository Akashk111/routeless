<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="busYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="busGlass4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#bgG4)"/>
  <rect y="280" width="600" height="80" fill="#334155"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#FFF" stroke-width="3" stroke-dasharray="25 20"/>

  <ellipse cx="300" cy="295" rx="230" ry="18" fill="#000000" opacity="0.35"/>

  <!-- Bus Body -->
  <path d="M 80 110 Q 80 95 95 95 L 485 95 Q 515 95 520 125 L 525 245 Q 525 260 505 260 L 90 260 Q 80 260 80 245 Z" fill="url(#busYellow)"/>
  <rect x="80" y="210" width="445" height="18" fill="#1E3A8A"/>
  <text x="130" y="223" font-family="sans-serif" font-size="10" font-weight="900" fill="#FEF08A" letter-spacing="1.5">ALVA'S EDUCATION FOUNDATION • CAMPUS BUS</text>

  <!-- Destination Board -->
  <rect x="390" y="105" width="115" height="20" rx="3" fill="#0F172A"/>
  <text x="447" y="119" font-family="monospace" font-size="10" font-weight="bold" fill="#FACC15" text-anchor="middle">STUDENT SPECIAL</text>

  <!-- Front Windshield -->
  <path d="M 420 130 L 512 130 L 517 195 L 420 195 Z" fill="url(#busGlass4)"/>

  <!-- Windows with student silhouettes -->
  <g fill="url(#busGlass4)">
    <rect x="95" y="130" width="44" height="55" rx="4"/>
    <rect x="148" y="130" width="46" height="55" rx="4"/>
    <rect x="202" y="130" width="46" height="55" rx="4"/>
    <rect x="256" y="130" width="46" height="55" rx="4"/>
    <rect x="310" y="130" width="46" height="55" rx="4"/>
    <rect x="364" y="130" width="46" height="55" rx="4"/>
  </g>

  <!-- Wheels -->
  <circle cx="155" cy="265" r="32" fill="#0F172A"/>
  <circle cx="155" cy="265" r="24" fill="#334155"/>
  <circle cx="155" cy="265" r="14" fill="#EAB308"/>
  <circle cx="445" cy="265" r="32" fill="#0F172A"/>
  <circle cx="445" cy="265" r="24" fill="#334155"/>
  <circle cx="445" cy="265" r="14" fill="#EAB308"/>

  <!-- Category Badge -->
  <g transform="translate(20, 20)">
    <rect width="130" height="28" rx="8" fill="#CA8A04"/>
    <text x="65" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">College Shuttle</text>
  </g>
</svg>
